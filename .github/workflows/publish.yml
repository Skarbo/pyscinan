name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing (no API token):
# add this repository + workflow + environment "pypi" as a trusted publisher on pypi.org first.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv build
      - run: uv publish --trusted-publishing always
